-- FUNÇÕES DE CRIPTOGRAFIA AGGRESSIVE
function encryptAES512(texto, chave)
    local hash = ""
    for i = 1, #texto do
        local charCode = string.byte(texto, i) + #chave + i * 3
        hash = hash .. string.format("%02X", charCode % 256)
    end
    return "AES512[" .. hash .. "]" .. string.rep("✓", 3)
end

function encryptQuantum(texto, chave)
    local hash = ""
    for i = 1, #texto do
        local charCode = string.byte(texto, i) * #chave - i * 7
        hash = hash .. string.format("%04X", math.abs(charCode % 65536))
    end
    return "QUANTUM[" .. hash .. "]" .. string.rep("⚡", 2)
end

function encryptGhost(texto, chave)
    local hash = ""
    for i = 1, #texto do
        local charCode = (string.byte(texto, i) * 911) % 256
        hash = hash .. string.format("%02X", charCode)
    end
    return "GHOST[" .. hash .. "]" .. string.rep("👻", 3)
end

